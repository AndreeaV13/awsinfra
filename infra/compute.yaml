AWSTemplateFormatVersion: '2010-09-09'
Description: Server EC2 cu Flask, Grafana si monitoring

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Cheia API Gemini

  SnmpCommunity:
    Type: String
    NoEcho: true
    Description: Community string SNMP (v2c) pentru snmpd

Resources:
  # Rol IAM pentru EC2 - permite citirea din CloudWatch
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH, Flask, Grafana
      VpcId: !ImportValue network-vpc-id
      SecurityGroupIngress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: 161
          ToPort: 161
          CidrIp: 10.1.0.0/26
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: "frankfurt"
      IamInstanceProfile: !Ref Ec2InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > /var/log/user-data.log 2>&1
          set -e -x
          yum update -y
          yum install nginx python3 python3-pip git net-snmp net-snmp-utils -y
          pip3 install flask google-generativeai boto3
          git clone https://github.com/AndreeaV13/awsinfra.git /var/www/app

          # Configurare SNMP (net-snmp)
          cat > /etc/snmp/snmpd.conf << SNMPD_EOF
          rocommunity ${SnmpCommunity} 10.1.0.0/26
          syslocation aws-eu-central-1
          syscontact admin
          SNMPD_EOF
          systemctl enable snmpd
          systemctl start snmpd

          # Flask ca serviciu
          cat > /etc/systemd/system/flask.service << 'SYSTEMD_EOF'
          [Unit]
          Description=Flask App
          After=network.target

          [Service]
          WorkingDirectory=/var/www/app
          Environment="GEMINI_API_KEY=${GeminiApiKey}"
          ExecStart=/usr/bin/python3 /var/www/app/app.py
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target
          SYSTEMD_EOF

          # Instalare Grafana
          cat > /etc/yum.repos.d/grafana.repo << 'GRAFANA_EOF'
          [grafana]
          name=grafana
          baseurl=https://rpm.grafana.com
          repo_gpgcheck=0
          enabled=1
          gpgcheck=0
          GRAFANA_EOF

          yum install grafana -y
          grafana-cli plugins install grafana-snmp-plugin

          # Pornire servicii
          systemctl daemon-reload
          systemctl enable flask
          systemctl start flask
          systemctl enable grafana-server
          systemctl start grafana-server
          systemctl start nginx
          systemctl enable nginx
      Tags:
        - Key: Name
          Value: first-ec2-instance
      NetworkInterfaces:
        - AssociatePublicIpAddress: "true"
          DeviceIndex: "0"
          GroupSet:
            - !Ref InstanceSecurityGroup
          SubnetId: !ImportValue network-subnet3-id

Outputs:
  InstanceId:
    Value: !Ref WebServerInstance
  PublicIP:
    Value: !GetAtt WebServerInstance.PublicIp