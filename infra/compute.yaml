AWSTemplateFormatVersion: '2010-09-09'
Description: Server EC2 cu Flask, Prometheus, Node Exporter si Grafana (provisioned)

Parameters:
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64

  GeminiApiKey:
    Type: String
    NoEcho: true
    Description: Cheia API Gemini

Resources:
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles:
        - !Ref Ec2Role

  InstanceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH, Flask, Grafana, Prometheus, Node Exporter
      VpcId: !ImportValue network-vpc-id
      SecurityGroupIngress:
        - IpProtocol: icmp
          FromPort: -1
          ToPort: -1
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 3000
          ToPort: 3000
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 9090
          ToPort: 9090
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 9100
          ToPort: 9100
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  WebServerInstance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: !Ref LatestAmiId
      KeyName: "frankfurt"
      IamInstanceProfile: !Ref Ec2InstanceProfile
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          exec > /var/log/user-data.log 2>&1
          set -e -x

          # === SISTEM ===
          yum update -y
          yum install nginx python3 python3-pip git stress wget -y
          pip3 install flask requests boto3

          # === FLASK APP ===
          git clone https://github.com/AndreeaV13/awsinfra.git /var/www/app

          cat > /etc/systemd/system/flask.service << 'SYSTEMD_EOF'
          [Unit]
          Description=Flask App
          After=network.target

          [Service]
          WorkingDirectory=/var/www/app
          Environment="GEMINI_API_KEY=${GeminiApiKey}"
          ExecStart=/usr/bin/python3 /var/www/app/app.py
          Restart=always
          User=root

          [Install]
          WantedBy=multi-user.target
          SYSTEMD_EOF

          # === NODE EXPORTER ===
          useradd -rs /bin/false node_exporter || true
          cd /tmp
          wget https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
          tar -xf node_exporter-1.8.2.linux-amd64.tar.gz
          mv node_exporter-1.8.2.linux-amd64/node_exporter /usr/local/bin/
          rm -rf node_exporter-1.8.2.linux-amd64*

          cat > /etc/systemd/system/node_exporter.service << 'NE_EOF'
          [Unit]
          Description=Node Exporter
          After=network.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
          NE_EOF

          # === PROMETHEUS ===
          useradd -rs /bin/false prometheus || true
          mkdir -p /etc/prometheus /var/lib/prometheus
          cd /tmp
          wget https://github.com/prometheus/prometheus/releases/download/v2.53.0/prometheus-2.53.0.linux-amd64.tar.gz
          tar -xf prometheus-2.53.0.linux-amd64.tar.gz
          mv prometheus-2.53.0.linux-amd64/prometheus prometheus-2.53.0.linux-amd64/promtool /usr/local/bin/
          mv prometheus-2.53.0.linux-amd64/consoles prometheus-2.53.0.linux-amd64/console_libraries /etc/prometheus/
          rm -rf prometheus-2.53.0.linux-amd64*

          cat > /etc/prometheus/prometheus.yml << 'PROM_EOF'
          global:
            scrape_interval: 15s

          scrape_configs:
            - job_name: 'node_exporter'
              static_configs:
                - targets: ['localhost:9100']
          PROM_EOF

          chown -R prometheus: /etc/prometheus /var/lib/prometheus

          cat > /etc/systemd/system/prometheus.service << 'PS_EOF'
          [Unit]
          Description=Prometheus
          After=network.target

          [Service]
          User=prometheus
          Group=prometheus
          Type=simple
          ExecStart=/usr/local/bin/prometheus \
            --config.file /etc/prometheus/prometheus.yml \
            --storage.tsdb.path /var/lib/prometheus/ \
            --web.console.templates=/etc/prometheus/consoles \
            --web.console.libraries=/etc/prometheus/console_libraries

          [Install]
          WantedBy=multi-user.target
          PS_EOF

          # === GRAFANA - INSTALARE ===
          cat > /etc/yum.repos.d/grafana.repo << 'GR_EOF'
          [grafana]
          name=grafana
          baseurl=https://rpm.grafana.com
          repo_gpgcheck=0
          enabled=1
          gpgcheck=0
          GR_EOF

          yum install grafana -y

          # === GRAFANA - PROVISIONING SURSA DE DATE (automat, fara sa mai adaugi manual) ===
          mkdir -p /etc/grafana/provisioning/datasources
          cat > /etc/grafana/provisioning/datasources/prometheus.yml << 'DS_EOF'
          apiVersion: 1

          datasources:
            - name: Prometheus
              type: prometheus
              access: proxy
              url: http://localhost:9090
              isDefault: true
              editable: true
          DS_EOF

          # === GRAFANA - PROVISIONING DASHBOARD (descarca automat Node Exporter Full) ===
          mkdir -p /etc/grafana/provisioning/dashboards
          cat > /etc/grafana/provisioning/dashboards/default.yml << 'DB_PROV_EOF'
          apiVersion: 1

          providers:
            - name: 'default'
              orgId: 1
              folder: ''
              type: file
              disableDeletion: false
              updateIntervalSeconds: 30
              options:
                path: /var/lib/grafana/dashboards
          DB_PROV_EOF

          mkdir -p /var/lib/grafana/dashboards
          wget -O /var/lib/grafana/dashboards/node-exporter-full.json \
            https://grafana.com/api/dashboards/1860/revisions/37/download
          sed -i 's/${DS_PROMETHEUS}/Prometheus/g' /var/lib/grafana/dashboards/node-exporter-full.json

          chown -R grafana:grafana /var/lib/grafana/dashboards

          # === PORNIRE SERVICII ===
          systemctl daemon-reload
          systemctl enable node_exporter && systemctl start node_exporter
          systemctl enable prometheus && systemctl start prometheus
          systemctl enable grafana-server && systemctl start grafana-server
          systemctl enable flask && systemctl start flask
          systemctl enable nginx && systemctl start nginx

          echo "=== SETUP COMPLET ===" >> /var/log/user-data.log
      Tags:
        - Key: Name
          Value: first-ec2-instance
      NetworkInterfaces:
        - AssociatePublicIpAddress: "true"
          DeviceIndex: "0"
          GroupSet:
            - !Ref InstanceSecurityGroup
          SubnetId: !ImportValue network-subnet3-id

Outputs:
  InstanceId:
    Value: !Ref WebServerInstance
  PublicIP:
    Value: !GetAtt WebServerInstance.PublicIp