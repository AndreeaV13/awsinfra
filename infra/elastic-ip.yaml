AWSTemplateFormatVersion: '2010-09-09'
Description: Elastic IP fix pentru serverul EC2

Resources:
  MyElasticIP:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: infrapulse-eip

Outputs:
  ElasticIPAllocationId:
    Value: !GetAtt MyElasticIP.AllocationId

  ElasticIPAddress:
    Value: !Ref MyElasticIP