name: Deploy site

on:
  push:
    branches: [master]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: eu-central-1
  PROJECT_NAME: primul-meu-site
  BUCKET_NAME: primul-meu-site-616077259946-eu-central-1
  ARTIFACTS_BUCKET: cfn-artifacts-616077259946-eu-central-1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::616077259946:role/github-actions-awsinfra-deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Determine environment tag
        id: envtag
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "environment=production" >> "$GITHUB_OUTPUT"
          else
            echo "environment=staging" >> "$GITHUB_OUTPUT"
          fi

      # Bucket pentru template-urile nested (trebuie sa existe inaintea 'package')
      - name: Deploy artifacts bucket (bootstrap)
        run: |
          aws cloudformation deploy \
            --template-file infra/artifacts-bucket.yaml \
            --stack-name cfn-artifacts-stack \
            --tags Environment=${{ steps.envtag.outputs.environment }} Owner=${{ github.actor }} \
            --region ${{ env.AWS_REGION }}

      # Incarca network.yaml, elastic-ip.yaml, compute.yaml, site.yaml pe S3
      # si rescrie TemplateURL din main.yaml cu locatiile lor
      - name: Package nested stack templates
        run: |
          aws cloudformation package \
            --template-file infra/main.yaml \
            --s3-bucket ${{ env.ARTIFACTS_BUCKET }} \
            --s3-prefix cfn-templates \
            --output-template-file packaged-main.yaml \
            --region ${{ env.AWS_REGION }}

      # STACK unic: network + elastic-ip + compute + site, ca nested stacks.
      # CloudFormation deduce ordinea din GetAtt si face deploy/rollback atomic pentru toate.
      - name: Deploy infra stack (nested: network, elastic-ip, compute, site)
        run: |
          aws cloudformation deploy \
            --template-file packaged-main.yaml \
            --capabilities CAPABILITY_IAM \
            --stack-name infra-stack \
            --parameter-overrides GeminiApiKey=${{ secrets.GEMINI_API_KEY }} ProjectName=${{ env.PROJECT_NAME }} \
            --tags Environment=${{ steps.envtag.outputs.environment }} Owner=${{ github.actor }} \
            --region ${{ env.AWS_REGION }}

      # Sincronizeaza fisierele site-ului
      - name: Sync site files to S3
        run: |
          aws s3 sync site/ s3://${{ env.BUCKET_NAME }}/ --delete --region ${{ env.AWS_REGION }}

      # Goleste cache-ul CloudFront
      - name: Invalidate CloudFront cache
        run: |
          DISTRIBUTION_ID=$(aws cloudformation describe-stacks \
            --stack-name infra-stack \
            --region ${{ env.AWS_REGION }} \
            --query "Stacks[0].Outputs[?OutputKey=='DistributionId'].OutputValue" \
            --output text)
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"